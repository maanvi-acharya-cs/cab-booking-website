<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to your RideBuddy account</title>
    <link rel="stylesheet" href="login-phone.css">
    <script>
        function toggleMenu(el) {
        el.classList.toggle("active");
        }
    </script>
</head>
<body>
    <header class="header">

        <div class="logo-name">
            <img src="logo1.gif" alt="logo" class="logo">
            <h1 class="app-name">RideBuddy</h1>
        </div>

        <div class="rightdiv" >
            <a href="book.html" class="bookcab">Book a Cab</a>


            
            <div class="profile" onclick="toggleMenu(this)">
                <img src="profile.png" alt="Profile" class="profile-pic">
                <span class="arrow">▼</span>
                <div class="dropdown">
                    <a href="login.html">Log in <span>›</span></a>
                    <a href="signup.html">Sign up <span>›</span></a>
                </div>
            </div>

        </div>

  </header>

  <div class="login-container">
    <h2>What's your PhoneNumber?</h2>
    
      <label class="label">Phhone Number</label>
      <input type="text" placeholder="+91" maxlength="13"  >
      <label class="label">OTP</label>
      <input type="text" placeholder="Password" maxlength="6">
    
      <div class="options">
        <label>
          <input type="checkbox" checked>
          Remember me
        </label>
      </div>
      
      <a href="front.html"><button type="submit" class="login-btn">Sign In</button></a>
    
  </div>
    

</body>
</html>
